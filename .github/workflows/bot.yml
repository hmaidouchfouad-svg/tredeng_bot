name: Python Trading Bot

on:
  schedule:
    # يخدم كل 5 دقائق من الإثنين إلى الجمعة
    - cron: '*/5 * * * 1-5'
  workflow_dispatch: # زر التشغيل اليدوي للتجربة

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas pandas_ta numpy

      - name: Run Trading Bot
        run: |
          python main.py
